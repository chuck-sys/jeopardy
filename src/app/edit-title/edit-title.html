@if (isEditing) {
<mat-form-field>
  <mat-label>Title</mat-label>
  <input
    matInput
    appAutoFocus
    [(ngModel)]="newName"

    (focusout)="handleCancelEditHeader()"
    (keyup.escape)="handleCancelEditHeader()"
    (keyup.enter)="handleSubmitHeader()">
</mat-form-field>
} @else {
<h2 (click)="handleClickHeader()">{{ gameName() }} <mat-icon fontIcon="edit"></mat-icon></h2>
}
