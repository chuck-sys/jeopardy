@if (isEditing) {
<div class="input-field">
  <label>
    Title
    <input
      type="text"
      autofocus
      [(ngModel)]="newName"

      (focusout)="handleCancelEditHeader()"
      (keyup.escape)="handleCancelEditHeader()"
      (keyup.enter)="handleSubmitHeader()">
  </label>
</div>
} @else {
<h3 (click)="handleClickHeader()">{{ gameName() }} <i class="material-icons">edit</i></h3>
}
