<h2 mat-dialog-title>Create a new category</h2>

<mat-dialog-content>
  <mat-form-field>
    <mat-label>Category name</mat-label>
    <input matInput [(ngModel)]="name">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Order</mat-label>
    <input type="number" matInput [(ngModel)]="order">
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton (click)="handleCancel()">Cancel</button>
  <button matButton (click)="handleCreate()">Create</button>
</mat-dialog-actions>
